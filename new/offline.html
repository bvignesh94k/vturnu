<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You're offline | VTurnU</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F7B500">
<link rel="icon" type="image/png" href="/assets/img/favicon.png">
<style>
    /* Self-contained: this page must render with no network at all. */
    :root { --brand:#F7B500; --ink:#17181C; --muted:#6B6F78; --line:#ECE9E1; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body {
        min-height:100vh; display:grid; place-items:center; padding:24px;
        font:16px/1.65 "Manrope","Segoe UI",system-ui,-apple-system,sans-serif;
        color:var(--ink);
        background:
            radial-gradient(ellipse 800px 460px at 75% 10%, rgba(247,181,0,.18), transparent 60%),
            radial-gradient(ellipse 620px 380px at 10% 92%, rgba(232,54,93,.10), transparent 60%),
            #FFFDF7;
    }
    .wrap { max-width:520px; text-align:center; }
    .mark { width:72px; height:72px; margin:0 auto 26px; display:block; }
    h1 { font-size:clamp(1.7rem,5vw,2.4rem); line-height:1.15; letter-spacing:-.02em; margin-bottom:14px; }
    p { color:var(--muted); margin-bottom:12px; }
    .actions { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:26px; }
    .btn {
        display:inline-flex; align-items:center; gap:8px; font-weight:800; font-size:.95rem;
        padding:13px 26px; border-radius:999px; border:0; cursor:pointer;
        text-decoration:none; color:var(--ink);
        background:linear-gradient(135deg,#FFC20E,#F7B500 60%,#F98F1F);
    }
    .btn-ghost { background:transparent; border:2px solid rgba(23,24,28,.22); padding:11px 24px; }
    .tip { margin-top:30px; padding-top:22px; border-top:1px solid var(--line); font-size:.88rem; }
    .tip a { color:#C22349; font-weight:700; }
    @media (prefers-color-scheme: dark) {
        body { background:#131417; color:#F4F2ED; }
        p, .tip { color:#A9ADB6; }
        .btn-ghost { color:#F4F2ED; border-color:rgba(255,255,255,.28); }
    }
</style>
</head>
<body>
<main class="wrap">
    <svg class="mark" viewBox="0 0 512 512" aria-hidden="true">
        <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#F7B500"/><stop offset="45%" stop-color="#E8365D"/>
            <stop offset="75%" stop-color="#9B59B6"/><stop offset="100%" stop-color="#29B8DB"/>
        </linearGradient></defs>
        <path d="M150 156 L256 366 L362 156 L306 156 L256 258 L206 156 Z" fill="url(#g)"/>
        <circle cx="256" cy="392" r="18" fill="#F7B500"/>
    </svg>

    <h1>You're offline</h1>
    <p>We couldn't reach the network. Any page you've already visited will still open. Everything else needs a connection.</p>

    <div class="actions">
        <button class="btn" onclick="location.reload()">Try Again</button>
        <a class="btn btn-ghost" href="/">Go to Homepage</a>
    </div>

    <p class="tip">Need us urgently? Message us on
        <a href="https://wa.me/919363731498">WhatsApp</a>,
        it'll send as soon as you're back online.</p>
</main>
<script>
    // Reload automatically the moment connectivity returns.
    window.addEventListener('online', function () { location.reload(); });
</script>
</body>
</html>

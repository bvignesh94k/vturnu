    <div style="background: #17181C; color: #F7B500; padding: 16px 48px; border-radius: 50px; font-weight: 600; font-size: 18px; display: inline-block; cursor: pointer; box-shadow: 0 10px 30px rgba(0,0,0,0.2); letter-spacing: 0.5px;">
      Let's Transform Your Business →
    </div>

  <div style="position: absolute; bottom: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, #00BCD4, #FF6B9D, #F7B500);"></div>
